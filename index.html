<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Cuaderno digital para docentes: apuntes tipo Notion, agenda semanal, grupos con pase de lista, calificaciones y rúbricas. Sin servidor, todo en tu navegador.">
<meta name="theme-color" content="#0071e3">
<title>Cuaderno del Profesor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<aside id="sidebar">
  <div class="sb-brand">
    <span class="sb-brand-icon">📚</span>
    <span class="sb-brand-name">Cuaderno del Profesor</span>
  </div>

  <div class="sb-actions">
    <div class="sb-item" id="btn-today">
      <span class="sb-item-icon">🏠</span> Hoy
    </div>
    <div class="sb-item" id="btn-search">
      <span class="sb-item-icon">🔍</span> Buscar
      <span class="kbd">⌘K</span>
    </div>
    <div class="sb-item" id="btn-agenda">
      <span class="sb-item-icon">📅</span> Agenda semanal
    </div>
    <div class="sb-item" id="btn-tasks">
      <span class="sb-item-icon">✅</span> Tareas
    </div>
    <div class="sb-item" id="btn-rubrics">
      <span class="sb-item-icon"></span> Rúbricas
    </div>
  </div>

  <div class="sb-section" id="fav-section" hidden>
    <div class="sb-label">Favoritos</div>
    <div id="fav-list"></div>
  </div>

  <div class="sb-section">
    <div class="sb-label">
      Asignaturas
      <button id="btn-new-subject" title="Nueva asignatura">+</button>
    </div>
    <div id="subject-list"></div>
  </div>

  <div class="sb-section">
    <div class="sb-label">
      Grupos
      <button id="btn-new-group" title="Nuevo grupo">+</button>
    </div>
    <div id="group-list"></div>
  </div>

  <div class="sb-section grow">
    <div class="sb-label">
      Páginas
      <button id="btn-new-page" title="Nueva página">+</button>
    </div>
    <div id="page-tree"></div>
  </div>

  <div class="sb-footer">
    <button id="btn-github" class="sb-item"><span class="sb-item-icon">☁️</span> Sincronizar con GitHub</button>
    <button id="btn-backup" class="sb-item"><span class="sb-item-icon">💾</span> Copia de seguridad</button>
    <button id="btn-theme" class="sb-item"><span class="sb-item-icon">🌙</span> <span id="theme-label">Tema oscuro</span></button>
  </div>
</aside>

<button id="btn-hamburger" aria-label="Abrir menú" title="Menú">☰</button>
<div id="sb-backdrop"></div>

<main id="main">
  <header id="topbar"></header>
  <div id="content"></div>
</main>

<div id="slash-menu" hidden></div>
<div id="popover" hidden></div>
<div id="overlay" hidden></div>
<div id="present" hidden></div>

<!-- Scripts clásicos (compatibles con file://). El orden de carga importa:
     util y storage definen la base; main arranca la aplicación. -->
<script src="js/util.js"></script>
<script src="js/storage.js"></script>
<script src="js/editor.js"></script>
<script src="js/shell.js"></script>
<script src="js/views.js"></script>
<script src="js/groups.js"></script>
<script src="js/agenda.js"></script>
<script src="js/present.js"></script>
<script src="js/sync.js"></script>
<script src="js/rubrics.js"></script>
<script src="js/main.js"></script>
</body>
</html>
